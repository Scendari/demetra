{# Une option de brique ou un réglage de la situation : une case à cocher quand il vaut vrai ou faux, sinon une liste de valeurs. #}
{% if c.number %}<label class="pick pick-number"><span>{{ c.label }}{% if c.unit %} ({{ c.unit }}){% endif %}</span><input type="number" inputmode="decimal" name="{{ c.name }}" value="{{ c.value }}" min="{{ c.number.min }}" max="{{ c.number.max }}" step="{{ c.number.step }}" autocomplete="off"></label>{% elif c.switch %}<label class="tick"><input type="checkbox" name="{{ c.name }}" value="true"{% if c.on %} checked{% endif %}><span>{{ c.label }}</span></label>{% else %}<label class="pick"><span>{{ c.label }}</span><select name="{{ c.name }}">{% for v in c.values %}<option value="{{ v.value }}"{% if v.selected %} selected{% endif %}>{{ v.label }}</option>{% endfor %}</select></label>{% endif %}
